services:
  db:
    image: postgres:16-alpine
    container_name: deploypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deploypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deploypilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-deploypilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deploypilot} -d ${POSTGRES_DB:-deploypilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deploypilot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deploypilot}:${POSTGRES_PASSWORD:-deploypilot_secret}@db:5432/${POSTGRES_DB:-deploypilot}
      SECRET_KEY: ${SECRET_KEY:-deploypilot_super_secret_jwt_key_change_in_production}
      FERNET_KEY: ${FERNET_KEY:-u_vI33_hS-96B1QYh1kYwQf4L0cZ3N-7g6Lp5N-yq8M=}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deploypilot-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: deploypilot-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: deploypilot-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  # Sample target application for local deployment testing
  sample-target-app:
    build:
      context: ./deploy/sample-target-app
      dockerfile: Dockerfile
    container_name: sample-target-app
    restart: unless-stopped
    environment:
      APP_VERSION: "1.0.0"
      APP_HEALTH_STATUS: "healthy"
    ports:
      - "8080:8080"
    profiles:
      - sample

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
